[package]
name = "xr1-vision"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Perception, kinematics and experiment journal for the XR1 grasping stack"

[dependencies]
harness-contracts = { path = "../harness-contracts" }
harness-evaluation = { path = "../harness-evaluation" }
yellow-block-pick-place = { path = "../../task-packs/yellow-block-pick-place" }
image = { version = "0.24.9", default-features = false, features = ["png"] }
nalgebra = "0.32"
roxmltree = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
