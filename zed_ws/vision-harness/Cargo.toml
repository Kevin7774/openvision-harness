[package]
name = "vision-harness"
version = "0.1.0"
edition = "2021"

[dependencies]
image = { version = "0.24.9", default-features = false, features = ["png"] }
nalgebra = "0.32"
roxmltree = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
